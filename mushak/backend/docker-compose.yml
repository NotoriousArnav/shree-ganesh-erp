services:
  db:
    image: postgres:17-alpine
    container_name: mushak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mushak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mushak_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mushak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mushak-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mushak} -d ${POSTGRES_DB:-mushak}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for product images, invoices and attachments.
  # Console: http://localhost:9001 — sign in with S3_ACCESS_KEY / S3_SECRET_KEY.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: mushak-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-mushakadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-mushak_dev_storage_secret}
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    command: ["/data"]
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - mushak-rustfs-data:/data
      - mushak-rustfs-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mushak-db-data:
  mushak-rustfs-data:
  mushak-rustfs-logs:
